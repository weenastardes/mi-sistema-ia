name: Worker de Monitoreo

on:
  schedule:
    # Ejecutar cada 10 minutos
    - cron: '*/10 * * * *'
  
  workflow_dispatch: # Para ejecutar manualmente

jobs:
  run-worker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar zona horaria CANARIAS
      run: |
        sudo timedatectl set-timezone Atlantic/Canary
        echo "📍 Zona horaria configurada: $(date)"
        echo "🕐 Hora actual en Canarias: $(date +'%H:%M:%S')"
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        pip install pytz
    
    - name: Ejecutar worker
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        TZ: Atlantic/Canary
      run: |
        python worker.py
    
    - name: Verificar ejecución
      run: |
        echo "✅ Worker ejecutado correctamente a las $(date)"
